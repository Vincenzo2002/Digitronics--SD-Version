name: CI

# Quando parte la pipeline: a ogni push su qualsiasi branch (master
# compreso, quindi anche dopo ogni merge), a ogni pull request verso il
# branch principale, oppure manualmente dalla tab Actions.
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Privilegio minimo: il GITHUB_TOKEN può solo leggere il codice.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (Java 21)
    # Runner effimero: ogni esecuzione parte da una macchina pulita.
    runs-on: ubuntu-latest
    # Un'esecuzione bloccata fallisce dopo 15 minuti invece di 6 ore.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # JDK fissato (Temurin 21) e cache delle dipendenze Maven,
      # invalidata quando cambia il pom.xml.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Maven Wrapper: stessa versione di Maven in locale e in CI.
      # "verify" compila, esegue i test e crea il WAR in un solo passaggio.
      - name: Build and run tests
        run: ./mvnw -B clean verify

      # Invia a Codecov il report XML di JaCoCo generato da "verify".
      # Il token è il secret CODECOV_TOKEN della repo, mai scritto nel file.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: true

      # Mutation testing con le soglie di PITest (mutation score e line coverage all'80%).
      # "test-compile" esegue le fasi in cui Maven prepara gli agent di JaCoCo e Mockito
      # usati dai test: senza, PITest non riesce ad avviarli.
      - name: Run mutation testing
        run: ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage

      # Report di coverage e di mutation testing, caricati anche se uno step fallisce.
      - name: Upload coverage and mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            target/site/jacoco/
            target/pit-reports/
          if-no-files-found: ignore

      # I report dei test vengono caricati anche se un test fallisce.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      # Il WAR viene caricato solo se build e test hanno successo,
      # con lo SHA del commit nel nome e conservato per 30 giorni.
      - name: Upload WAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: digitronics-${{ github.sha }}
          path: target/digitronics.war
          retention-days: 30

  validate-docker:
    name: Validate Docker build
    needs: build-and-test
    # needs impedisce l'avvio se build, test o caricamento degli artifact falliscono.
    # Verifica il Dockerfile sul risultato del merge, senza secrets o push.
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/docker-build.yml
    with:
      publish: false

  publish-docker:
    name: Publish Docker image
    needs: build-and-test
    # Pubblica soltanto da master, dopo tutti i controlli, su push (merge compreso)
    # o avvio manuale della CI. Il controllo sul repository esclude le copie fork.
    if: >-
      github.repository == 'Vincenzo2002/Digitronics--SD-Version' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master'
    uses: ./.github/workflows/docker-build.yml
    with:
      publish: true
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
