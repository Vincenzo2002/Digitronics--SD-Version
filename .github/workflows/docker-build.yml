name: Docker Build

# ci.yml richiama questo workflow dopo il successo dei test Java.
on:
  workflow_call:
    inputs:
      # Con false verifica la build su AMD64. Con true pubblica per AMD64 e ARM64.
      publish:
        description: Pubblica su DockerHub dopo la build
        type: boolean
        default: false
    secrets:
      # ci.yml passa le credenziali DockerHub solo al job di pubblicazione.
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build-image:
    name: ${{ inputs.publish && 'Build and publish Docker image' || 'Validate Docker build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: docker-build-${{ github.ref }}-${{ inputs.publish }}
      cancel-in-progress: false

    steps:
      # Scarica lo stesso commit che ha superato i test Java.
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # QEMU esegue programmi ARM64 sulla macchina AMD64 durante la build.
      - name: Set up QEMU
        if: inputs.publish
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: inputs.publish
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Assegna all'immagine un tag per il commit, uno per il branch e latest solo da master.
      - name: Generate image tags and labels
        if: inputs.publish
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/digitronics
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      # Il Dockerfile crea il WAR dai sorgenti dopo che la CI ha eseguito i test.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.publish && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          pull: true
          # Carica l'immagine su DockerHub solo se publish è true.
          push: ${{ inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Recupera e salva la cache su GitHub Actions.
          # mode=max include anche passaggi intermedi come il download delle dipendenze Maven.
          cache-from: type=gha,scope=digitronics
          cache-to: type=gha,mode=max,scope=digitronics
